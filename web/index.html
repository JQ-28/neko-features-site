let toastTimer;
let toastQueue = [];
const toast = (msg) => {
  const el = $('toast');
  if (el.classList.contains('show')) { toastQueue.push(msg); return; }
  el.textContent = msg;
  el.classList.add('show');
  toastTimer = setTimeout(() => {
    el.classList.remove('show');
    if (toastQueue.length) { const next = toastQueue.shift(); setTimeout(() => toast(next), 200); }
  }, 1800);
};
const copyText = (btn, text) => {
  const done = () => {
    const old = btn.innerHTML;
    btn.innerHTML = '已复制喵✓';
    btn.classList.add('ok');
    setTimeout(() => { btn.innerHTML = old; btn.classList.remove('ok'); }, 1400);
  };
  if (navigator.clipboard?.writeText) {
    navigator.clipboard.writeText(text).then(done, () => toast('复制失败了呀喵…'));
  } else {
    const ta = document.createElement('textarea');
    ta.value = text; document.body.appendChild(ta); ta.select();
    try { document.execCommand('copy'); done(); } catch { toast('复制失败了呀喵…'); }
    ta.remove();
  }
};

  const input = $('m-body')?.querySelector('input[type=file][accept*="image"]');

const feedFilesToInput = (input, files) => {
  if (!input || !files.length) return false;
  const dt = new DataTransfer();
  for (const f of files) dt.items.add(f);
  input.files = dt.files;
  input.dispatchEvent(new Event('change', { bubbles: true }));
  return true;
};

  if (!$('mask').classList.contains('open')) return;

  const imgs = [...(e.clipboardData?.items ?? [])].filter((i) => i.kind === 'file' && i.type.startsWith('image/'));
  const files = imgs.map((i) => i.getAsFile()).filter(Boolean);
  if (files.length) feedFilesToInput(getActiveImgInput(), files);
});

  if (!$('mask').classList.contains('open') || !getActiveImgInput()) return;

});
document.addEventListener('dragleave', (e) => {
  if (e.relatedTarget === null) $('drag-mask').classList.remove('on');
});
document.addEventListener('drop', (e) => {
  $('drag-mask').classList.remove('on');
  if (!$('mask').classList.contains('open') || !getActiveImgInput()) return;
  const files = [...(e.dataTransfer?.files ?? [])].filter((f) => f.type.startsWith('image/'));
  if (files.length) {

    feedFilesToInput(getActiveImgInput(), files);
  }
});

/* 灯箱：点击聊天内图片放大查看，支持双击/滚轮缩放与拖拽平移 */
const lb = { scale: 1, x: 0, y: 0, drag: null };
const lbApply = () => {
  const img = $('lb-img'), box = $('lightbox');
  box.classList.toggle('zoomed', lb.scale > 1);
  img.style.setProperty('--lb-scale', lb.scale);
  img.style.setProperty('--lb-tf', `translate(${lb.x}px, ${lb.y}px)`);
};
const lbReset = () => { lb.scale = 1; lb.x = 0; lb.y = 0; lbApply(); };
const openLightbox = (src) => {
  $('lb-img').src = src;
  lbReset();
  $('lightbox').classList.add('open');
};
const closeLightbox = () => {
  $('lightbox').classList.remove('open', 'zoomed');
  $('lb-img').src = '';
};
const lbZoom = (delta) => {
  const next = Math.min(5, Math.max(1, lb.scale + delta));
  if (next === lb.scale) return;
  lb.scale = next;
  if (next === 1) { lb.x = 0; lb.y = 0; }
  lbApply();
};
$('lb-img').addEventListener('dblclick', () => lbZoom(lb.scale > 1 ? -lb.scale + 1 : 1));
$('lightbox').addEventListener('wheel', (e) => {
  if (!$('lightbox').classList.contains('open')) return;
  e.preventDefault();
  lbZoom(e.deltaY < 0 ? .5 : -.5);
}, { passive: false });
$('lb-img').addEventListener('pointerdown', (e) => {
  if (lb.scale <= 1) return;
  e.preventDefault();
  lb.drag = { sx: e.clientX, sy: e.clientY, ox: lb.x, oy: lb.y };
  $('lb-img').classList.add('dragging');
});
window.addEventListener('pointermove', (e) => {
  if (!lb.drag) return;
  lb.x = lb.drag.ox + (e.clientX - lb.drag.sx);
  lb.y = lb.drag.oy + (e.clientY - lb.drag.sy);
  lbApply();
});
window.addEventListener('pointerup', () => {
  lb.drag = null;
  $('lb-img').classList.remove('dragging');
});
$('lb-close').innerHTML = svg('close', 20);
$('lb-close').onclick = closeLightbox;
$('lightbox').onclick = (e) => { if (e.target === $('lightbox')) closeLightbox(); };
$('m-chat').addEventListener('click', (e) => {

});
const loadJSZip = () => {
  if (window.JSZip) return Promise.resolve(window.JSZip);
  return new Promise((res, rej) => {
    const s = document.createElement('script');
    s.src = 'https://cdn.jsdelivr.net/npm/jszip@3.10.1/dist/jszip.min.js';
    s.onload = () => res(window.JSZip);
    s.onerror = () => rej(new Error('JSZip 加载失败'));
    document.head.appendChild(s);
  });
};
const saveBlob = (blob, name) => {
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = name;
  document.body.appendChild(a);
  a.click();
  a.remove();
  URL.revokeObjectURL(a.href);
};

/* 命令面板：Ctrl/Cmd+K 快速跳转功能 */
const cmdMask = $('cmd-mask'), cmdInput = $('cmd-input'), cmdList = $('cmd-list');
let cmdIndex = 0, cmdFiltered = [];
const renderCmd = () => {
  const q = cmdInput.value.trim().toLowerCase();
  if (q === '666') markEgg('s666');
  else if (q === '摸鱼' || q === '上班') { toast(moyerLine()); markEgg('moyer'); }
  else if (q === '404') { markEgg('s404'); setTimeout(() => { location.href = '/404-neko'; }, 1200); }
  else if (q === 'miao' || q === '喵') markEgg('sMiao');
  else if (q === '彩蛋' || q === 'eggs') { closeCmd(); openEggPanel(); return; }
  cmdFiltered = FEATURES.filter((f) => !q || (f.name + f.desc).toLowerCase().includes(q));
  cmdIndex = 0;
  cmdList.innerHTML = cmdFiltered.length
    ? cmdFiltered.map((f, i) => `<div class="cmd-item${i === 0 ? ' active' : ''}" data-id="${f.id}"><span class="cmd-ico">${svg(f.icon, 18)}</span><span class="cmd-name">${esc(f.name)}</span><span class="cmd-desc">${esc(f.group)}</span></div>`).join('')
    : '<div class="cmd-empty">没有匹配的功能喵～</div>';
  cmdList.querySelectorAll('.cmd-item').forEach((el) => { el.onclick = () => pickCmd(el.dataset.id); });
};
const pickCmd = (id) => { closeCmd(); openFeature(id); };
const openCmd = () => { cmdMask.classList.add('open'); cmdInput.value = ''; renderCmd(); setTimeout(() => cmdInput.focus(), 0); };
const closeCmd = () => cmdMask.classList.remove('open');
const moveCmd = (dir) => {
  if (!cmdFiltered.length) return;
  cmdIndex = (cmdIndex + dir + cmdFiltered.length) % cmdFiltered.length;
  cmdList.querySelectorAll('.cmd-item').forEach((el, i) => el.classList.toggle('active', i === cmdIndex));
  cmdList.querySelector('.cmd-item.active')?.scrollIntoView({ block: 'nearest' });
};
cmdInput.oninput = renderCmd;
cmdInput.onkeydown = (e) => {
  if (e.key === 'ArrowDown') { e.preventDefault(); moveCmd(1); }
  else if (e.key === 'ArrowUp') { e.preventDefault(); moveCmd(-1); }
  else if (e.key === 'Enter') { e.preventDefault(); if (cmdFiltered[cmdIndex]) pickCmd(cmdFiltered[cmdIndex].id); }
  else if (e.key === 'Escape') { e.stopPropagation(); closeCmd(); }
};
cmdMask.onclick = (e) => { if (e.target === cmdMask) closeCmd(); };
document.addEventListener('keydown', (e) => {
  if ((e.ctrlKey || e.metaKey) && (e.key === 'k' || e.key === 'K')) { e.preventDefault(); cmdMask.classList.contains('open') ? closeCmd() : openCmd(); }
});

/* ─────────────── 摸鱼日历卡：今日进度 + 距周末/节假日 ─────────────── */
{
  const fmt = (d) => `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
  const today = new Date();
  const todayStr = fmt(today);
  const holidayMap = new Map(HOLIDAYS.map((h) => [h.date, h]));
  const isRestDay = (d) => {
    const h = holidayMap.get(fmt(d));
    if (h) return !h.work;
    const day = d.getDay();
    return day === 0 || day === 6;
  };
  const daysUntil = (pred) => {
    for (let i = 0; i <= 400; i++) {
      const d = new Date(today.getFullYear(), today.getMonth(), today.getDate() + i);
      if (i > 0 && pred(d)) return i;
    }
    return null;
  };

  const nowMins = today.getHours() * 60 + today.getMinutes();
  const dayPct = Math.round(((nowMins / 1440) * 100));
  const restToday = isRestDay(today);
  const lines = [];
  const curHoliday = holidayMap.get(todayStr);
  if (curHoliday && !curHoliday.work) {
    /* 连续假期：算出假期剩余天数 */
    let end = new Date(today);
    while (isRestDay(new Date(end.getFullYear(), end.getMonth(), end.getDate() + 1))) end = new Date(end.getFullYear(), end.getMonth(), end.getDate() + 1);
    const left = Math.round((end - today) / 864e5);
    lines.push(`今天${curHoliday.name}还放 ${left} 天喵`);
  } else {
    if (restToday) lines.push('今天是休息日喵～');
    else {
      const toWeekend = daysUntil((d) => isRestDay(d));
      if (toWeekend !== null) lines.push(`距周末还有 ${toWeekend} 天`);
      const toNextHoliday = daysUntil((d) => holidayMap.get(fmt(d)) && !holidayMap.get(fmt(d)).work);
      const nextHoliday = HOLIDAYS.find((h) => h.date > todayStr && !h.work);
      if (toNextHoliday !== null && nextHoliday) {
        lines.push(`距${nextHoliday.name}还有 ${toNextHoliday} 天（${nextHoliday.date.slice(5).replace('-', '.')}）`);
      }
    }
  }
  const el = $('moyu-card');
  el.innerHTML = `<div class="moyu-aurora"></div>
    <div class="moyu-glass"></div>
    <div class="side-info-head">摸鱼日历</div>
    <div class="moyu-pct">今天已过 <b>0%</b></div>
    <div class="moyu-progress"><i style="width:${dayPct}%"></i></div>
    ${lines.map((l) => `<div class="side-info-line">${esc(l)}</div>`).join('')}`;
  el.hidden = false;
  /* 百分比数字从 0 涨到目标值（Number ticker，ease-out cubic） */
  const b = el.querySelector('.moyu-pct b');
  if (window.matchMedia('(prefers-reduced-motion: reduce)').matches) {
    b.textContent = dayPct + '%';
  } else {
    const start = performance.now();
    const dur = 800;
    const tick = (now) => {
      const t = Math.min((now - start) / dur, 1);
      b.textContent = Math.round((1 - Math.pow(1 - t, 3)) * dayPct) + '%';
      if (t < 1) requestAnimationFrame(tick);
    };
    requestAnimationFrame(tick);
  }
  /* 每分钟刷新进度条 */
  setInterval(() => {
    const n = new Date();
    const pct = Math.round((n.getHours() * 60 + n.getMinutes()) / 1440 * 100);
    if (pct !== dayPct) {
      dayPct = pct;
      document.querySelectorAll('#moyu-card .moyu-pct b').forEach((b) => { b.textContent = pct + '%'; });
      document.querySelectorAll('#moyu-card .moyu-progress i').forEach((i) => { i.style.width = pct + '%'; });
    }
  }, 60_000);
}

/* ─────────────── 今日人品卡：种子 = uid + 日期，每天固定 ─────────────── */
{
  const uid = (() => {
    try {
      let v = localStorage.getItem('neko-uid');
      if (!v) {
        v = (typeof crypto !== 'undefined' && crypto.randomUUID) ? crypto.randomUUID() : String(Date.now()) + Math.random().toString(36).slice(2);
        localStorage.setItem('neko-uid', v);
      }
      return v;
    } catch { return String(Date.now()); }
  })();
  const hashStr = (s) => {
    let h = 2166136261;
    for (let i = 0; i < s.length; i++) { h ^= s.charCodeAt(i); h = Math.imul(h, 16777619); }
    return h >>> 0;
  };
  const today = new Date();
  const dateStr = `${today.getFullYear()}-${today.getMonth() + 1}-${today.getDate()}`;
  const score = hashStr(uid + ':' + dateStr) % 101;
  const r = JRRP_RANGES.find((x) => score >= x.min && score <= x.max) ?? JRRP_RANGES[0];
  const el = $('jrrp-card');
  el.innerHTML = `<div class="jrrp-aurora"></div>
    <div class="jrrp-glass"></div>
    <div class="side-info-head">今日人品</div>
    <div class="jrrp-row"><div class="jrrp-main"><b>${score}</b></div><span class="jrrp-level-big">${esc(r.level)}</span></div>`;
  el.hidden = false;

  const bubble = document.createElement('div');
  bubble.className = 'luck-bubble';
  bubble.innerHTML = `<span class="luck-level">${esc(r.level)}</span><span class="luck-desc">${esc(r.desc)}</span><img src="${encodeURI(r.img)}" alt="${esc(r.level)}">`;
  document.body.appendChild(bubble);
  const isMobile = window.matchMedia('(max-width: 780px)').matches;
  const placeBubble = (clientY) => {
    const rect = el.getBoundingClientRect();
    if (isMobile) {
      bubble.style.width = rect.width + 'px';
      let top = rect.bottom + 8;
      if (top + bubble.offsetHeight > window.innerHeight - 8) top = rect.top - bubble.offsetHeight - 8;
      top = Math.max(8, Math.min(top, window.innerHeight - bubble.offsetHeight - 8));
      bubble.style.left = rect.left + 'px';
      bubble.style.top = top + 'px';
    } else {
      bubble.style.width = '180px';
      let left = rect.left - bubble.offsetWidth - 12;
      if (left < 8) left = rect.right + 12;
      let top = clientY - bubble.offsetHeight / 2;
      top = Math.max(8, Math.min(top, window.innerHeight - bubble.offsetHeight - 8));
      bubble.style.left = left + 'px';
      bubble.style.top = top + 'px';
    }
  };
  bubble.addEventListener('click', (e) => e.stopPropagation());
  if (window.matchMedia('(hover: hover) and (pointer: fine)').matches) {
    el.addEventListener('mouseenter', (e) => { placeBubble(e.clientY); bubble.classList.add('open'); });
    el.addEventListener('mousemove', (e) => { if (!isMobile) placeBubble(e.clientY); });
    el.addEventListener('mouseleave', () => bubble.classList.remove('open'));
  } else {
    el.addEventListener('click', (e) => {
      e.stopPropagation();
      if (bubble.classList.contains('open')) { bubble.classList.remove('open'); return; }
      const rect = el.getBoundingClientRect();
      placeBubble(rect.top + rect.height / 2);
      bubble.classList.add('open');
    });
    document.addEventListener('click', () => bubble.classList.remove('open'));
  }
}

const updateWeatherClock = () => {
  const timeEl = document.querySelector('.weather-time');
  if (!timeEl) return;
  const now = new Date();
  timeEl.textContent = `${String(now.getHours()).padStart(2, '0')}:${String(now.getMinutes()).padStart(2, '0')}:${String(now.getSeconds()).padStart(2, '0')}`;
  const dateEl = document.querySelector('.weather-date');
  if (dateEl) dateEl.textContent = `${['周日', '周一', '周二', '周三', '周四', '周五', '周六'][now.getDay()]} ${String(now.getMonth() + 1).padStart(2, '0')}-${String(now.getDate()).padStart(2, '0')}`;
};
let weatherClockTimer = null;
let weatherData = null;
const renderWeather = (d) => {
  const el = $('weather-card');
  const dirMap = ['北', '北东北', '东北', '东东北', '东', '东东南', '东南', '南东南', '南', '南西南', '西南', '西西南', '西', '西西北', '西北', '北西北'];
  const dir = dirMap[Math.round(d.dirDeg / 22.5) % 16];
  const days = (d.days ?? []).slice(0, 4).map((x) => `<div class="wd-item"><span class="wd-ico">${WEATHER_ICONS[x.icon] ?? WEATHER_ICONS.cloud}</span><span class="wd-day">${x.day}</span></div>`).join('');
  el.className = 'side-info-card weather-card';
  el.innerHTML = `<div class="weather-bg"><i></i><i></i><i></i></div>
    <div class="weather-aurora"></div>
    <div class="weather-info">
      <div class="weather-left">
        <div class="weather-now"><span class="weather-ico">${WEATHER_ICONS[d.icon] ?? WEATHER_ICONS.cloud}</span><span class="weather-desc">${esc(d.desc)}</span></div>
        <div class="weather-temp">${d.temp}°</div>
        <div class="weather-range">${d.max}° / ${d.min}°</div>
      </div>
      <div class="weather-right">
        <div class="weather-clock">
          <div class="weather-time"></div>
          <div class="weather-date"></div>
        </div>
        <div class="weather-city">${esc(d.city)}</div>
      </div>
    </div>
    <div class="weather-days">${days}</div>`;
  el.hidden = false;
  el.title = `体感 ${d.feels}° · ${dir}风 ${d.wind}km/h · 湿度 ${d.hum}%`;
  weatherData = d;
  el.onclick = openWeatherModal;
  updateWeatherClock();
  if (!weatherClockTimer) weatherClockTimer = setInterval(updateWeatherClock, 1000);
};
const getWeatherCity = () => {
  try { return localStorage.getItem('neko-weather-city') || ''; } catch { return ''; }
};
const resolveWeatherCity = (city) => CITY_ALIASES[city.trim()] ?? city.trim();
/* 城市名 → 坐标（Open-Meteo 地理编码，结果持久缓存） */
const geocodeCity = async (city) => {
  const CACHE_KEY = 'neko-weather-geo';
  let cache = {};
  try { cache = JSON.parse(localStorage.getItem(CACHE_KEY) || '{}'); } catch { /* 忽略 */ }
  if (cache[city]) return cache[city];
  const res = await fetch(`https://geocoding-api.open-meteo.com/v1/search?name=${encodeURIComponent(city)}&count=1&language=zh`);
  if (!res.ok) throw new Error();
  const hit = (await res.json()).results?.[0];
  if (!hit) return null;
  const geo = { lat: hit.latitude, lon: hit.longitude, name: hit.name };
  cache[city] = geo;
  try { localStorage.setItem(CACHE_KEY, JSON.stringify(cache)); } catch { /* 忽略 */ }
  return geo;
};
/* wttr.in weatherCode → 图标key（回退源） */
const wtrIconKey = (code) => {
  if (code === 113) return 'sun';
  if (code === 116 || code === 119 || code === 122) return 'cloud';
  if (code === 143 || code === 248 || code === 260) return 'fog';
  if ((code >= 200 && code < 230) || [386, 389, 392, 395].includes(code)) return 'storm';
  if (code >= 320 && code < 339) return 'snow';
  if (code >= 286 && code < 320) return 'rain';
  return 'cloud';
};
/* Open-Meteo 被限流时回退 wttr.in */
const fetchWttrFallback = async (city) => {
  const res = await fetch(`https://wttr.in/${encodeURIComponent(city)}?format=j1&lang=zh`, { headers: { Accept: 'application/json' } });
  if (!res.ok) throw new Error();
  const data = await res.json();
  const cur = data.current_condition?.[0];
  if (!cur) throw new Error();
  const dirs = ['N', 'NNE', 'NE', 'ENE', 'E', 'ESE', 'SE', 'SSE', 'S', 'SSW', 'SW', 'WSW', 'W', 'WNW', 'NW', 'NNW'];
  const daily = (data.weather ?? []).map((item) => {
    const dt = new Date(`${item.date}T00:00:00`);
    const code = +item.hourly?.[0]?.weatherCode ?? 113;
    const week = ['周日', '周一', '周二', '周三', '周四', '周五', '周六'];
    return {
      day: ['日', '一', '二', '三', '四', '五', '六'][dt.getDay()],
      dayFull: week[dt.getDay()],
      date: item.date.slice(5).replace('-', '.'),
      icon: wtrIconKey(code),
      max: Math.round(+item.maxtempC),
      min: Math.round(+item.mintempC),
    };
  });
  return {
    at: Date.now(),
    city,
    desc: (cur.lang_zh?.[0]?.value ?? cur.weatherDesc?.[0]?.value ?? ''),
    icon: wtrIconKey(+cur.weatherCode),
    temp: Math.round(+cur.temp_C),
    feels: Math.round(+cur.FeelsLikeC),
    dirDeg: dirs.indexOf(cur.winddir16Point) * 22.5,
    wind: Math.round(+cur.windspeedKmph),
    hum: +cur.humidity,
    max: daily[0]?.max ?? Math.round(+cur.temp_C),
    min: daily[0]?.min ?? Math.round(+cur.temp_C),
    days: daily.slice(1),
  };
};
const loadWeather = async () => {
  const el = $('weather-card');
  const city = resolveWeatherCity(getWeatherCity()) || '北京';
  const cacheKey = `neko-weather-2-${city}`;
  try {
    const cached = JSON.parse(sessionStorage.getItem(cacheKey) || 'null');
    if (cached && Date.now() - cached.at < 600_000) return renderWeather(cached);
    let d;
    try {
      const geo = await geocodeCity(city);
      if (!geo) throw new Error('geo');
      const res = await fetch(`https://api.open-meteo.com/v1/forecast?latitude=${geo.lat}&longitude=${geo.lon}&current=temperature_2m,relative_humidity_2m,apparent_temperature,weather_code,wind_speed_10m,wind_direction_10m&daily=temperature_2m_max,temperature_2m_min,weather_code&forecast_days=5&timezone=auto`);
      if (!res.ok) throw new Error('api');
      const json = await res.json();
      const cur = json.current;
      if (!cur) throw new Error('api');
      const [desc, icon] = WMO_WEATHER[cur.weather_code] ?? ['未知', 'cloud'];
      const daily = json.daily;
      const days = (daily?.time ?? []).map((t, i) => {
        const [, di] = WMO_WEATHER[daily.weather_code[i]] ?? ['未知', 'cloud'];
        const dt = new Date(`${t}T00:00:00`);
        const week = ['周日', '周一', '周二', '周三', '周四', '周五', '周六'];
        return {
          day: ['日', '一', '二', '三', '四', '五', '六'][dt.getDay()],
          dayFull: week[dt.getDay()],
          date: t.slice(5).replace('-', '.'),
          icon: di,
          max: Math.round(daily.temperature_2m_max[i]),
          min: Math.round(daily.temperature_2m_min[i]),
        };
      });
      d = {
        at: Date.now(),
        city: geo.name || city,
        desc, icon,
        temp: Math.round(cur.temperature_2m),
        feels: Math.round(cur.apparent_temperature),
        dirDeg: cur.wind_direction_10m,
        wind: Math.round(cur.wind_speed_10m),
        hum: cur.relative_humidity_2m,
        max: Math.round(daily?.temperature_2m_max?.[0] ?? cur.temperature_2m),
        min: Math.round(daily?.temperature_2m_min?.[0] ?? cur.temperature_2m),
        days: days.slice(1),
      };
    } catch {
      d = await fetchWttrFallback(city);
    }
    try { sessionStorage.setItem(cacheKey, JSON.stringify(d)); } catch { /* 忽略 */ }
    renderWeather(d);
  } catch { el.hidden = true; }
};
loadWeather();

/* 天气完整弹窗：点按侧栏卡片打开，展示景观 + 当前天气 + 未来预报 */
function openWeatherModal() {
  const d = weatherData;
  if (!d) return;
  const now = new Date();
  const isNight = document.documentElement.classList.contains('dark') || now.getHours() >= 18 || now.getHours() < 6;
  document.querySelector('.weather-modal').classList.toggle('night', isNight);
  $('wm-icon').innerHTML = WEATHER_ICONS[d.icon] ?? WEATHER_ICONS.cloud;
  $('wm-desc').textContent = d.desc;
  $('wm-city').textContent = d.city;
  $('wm-temp').textContent = `${d.temp}°`;
  $('wm-date').textContent = `${['周日', '周一', '周二', '周三', '周四', '周五', '周六'][now.getDay()]} ${now.getMonth() + 1}月${now.getDate()}日`;
  const days = (d.days ?? []).slice(0, 3);
  $('wm-forecast').innerHTML = days.length
    ? days.map((x) => `
    <div class="wm-fc"><p>${x.dayFull} ${x.date}</p><p>${x.max}°</p></div>
    <div class="wm-separator"></div>`).join('')
    : '<p class="wm-empty">暂无预报数据</p>';
  const mask = $('weather-mask');
  clearTimeout(weatherCloseTimer);
  mask.hidden = false;
  requestAnimationFrame(() => mask.classList.add('open'));
}
let weatherCloseTimer = 0;
function closeWeatherModal() {
  const mask = $('weather-mask');
  mask.classList.remove('open');
  weatherCloseTimer = setTimeout(() => { mask.hidden = true; }, 200);
}
$('weather-modal-close').onclick = closeWeatherModal;
$('weather-mask').addEventListener('click', (e) => { if (e.target === $('weather-mask')) closeWeatherModal(); });

/* ─────────────── 搜索历史：聚焦/输入时下拉，localStorage 记忆 ─────────────── */
{
  const KEY = 'neko-search-history';
  const get = () => { try { return JSON.parse(localStorage.getItem(KEY) || '[]').filter((x) => typeof x === 'string'); } catch { return []; } };
  const set = (list) => { try { localStorage.setItem(KEY, JSON.stringify(list.slice(0, 8))); } catch { } };
  const input = $('search');
  const panel = $('search-history');
  let items = get();

  const render = () => {
    const q = input.value.trim().toLowerCase();
    const list = q ? items.filter((x) => x.toLowerCase().includes(q)) : items;
    if (!list.length) { panel.hidden = true; return; }
    panel.innerHTML = '';
    list.forEach((word) => {
      const b = document.createElement('button');
      b.type = 'button';
      b.className = 'search-hist-item';
      b.textContent = word;
      b.onclick = () => { input.value = word; panel.hidden = true; input.dispatchEvent(new Event('input', { bubbles: true })); input.focus(); };
      panel.appendChild(b);
    });
    const clear = document.createElement('button');
    clear.type = 'button';
    clear.className = 'search-hist-clear';
    clear.textContent = '清空历史';
    clear.onclick = (e) => { e.stopPropagation(); items = []; set([]); panel.hidden = true; };
    panel.appendChild(clear);
    panel.hidden = false;
  };
  const remember = () => {
    const q = input.value.trim();
    if (!q || q.length < 2) return;
    if (/^\d+$/.test(q)) return;
    items = [q, ...items.filter((x) => x.toLowerCase() !== q.toLowerCase())].slice(0, 8);
    set(items);
  };

  input.addEventListener('focus', render);
  input.addEventListener('input', render);
  input.addEventListener('blur', () => { setTimeout(() => { remember(); panel.hidden = true; }, 200); });
  document.addEventListener('click', (e) => {
    if (!e.target.closest('.search-inner')) panel.hidden = true;
  });
}
</script>
