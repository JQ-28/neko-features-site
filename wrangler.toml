# wrangler.toml
name = 'neko-features-site'
main = "src/index.ts"
compatibility_date = "2024-12-01"
compatibility_flags = ["nodejs_compat"]

[assets]
directory = "./web"
binding = "ASSETS"

[[kv_namespaces]]
binding = "KV"
id = "4221e3d726474d4c88a76536abd5d9f4"

[[r2_buckets]]
binding = "R2"
bucket_name = "neko-features"

# Secrets (set via: wrangler secret put <NAME>)
# YOUDAO_APP_KEY, YOUDAO_APP_SECRET
# BAIDU_APP_ID, BAIDU_APP_SECRET
# HUOSHAN_ACCESS_KEY, HUOSHAN_SECRET_KEY
# REMOVE_BG_KEY
# SAUCENAO_KEY
# EXHENTAI_COOKIE

[observability]
enabled = false
head_sampling_rate = 1
redact_query_string = false

[observability.logs]
enabled = true
head_sampling_rate = 1
persist = true
invocation_logs = true

[observability.traces]
enabled = false
persist = true
head_sampling_rate = 1
